version: '3.8'

services:
  postgres:
    container_name: auge-management-postgres
    image: bitnami/postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: auge-postgres
      PG_DATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres
